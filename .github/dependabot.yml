version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'master'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    groups:
      # Keep OTel on one PR; split bumps break peer resolution (see #391/#393)
      opentelemetry:
        patterns:
          - '@opentelemetry/*'
      production-deps:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - '@opentelemetry/*'
      dev-deps:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - '@opentelemetry/*'
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'master'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
  - package-ecosystem: 'docker'
    directory: '/'
    target-branch: 'master'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'docker'
    ignore:
      - dependency-name: 'node'
        update-types:
          - 'version-update:semver-major'
