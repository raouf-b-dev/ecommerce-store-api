version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'master'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    groups:
      opentelemetry:
        patterns:
          - '@opentelemetry/*'
      production-deps:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - '@opentelemetry/*'
      dev-deps:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - '@opentelemetry/*'
    ignore:
      # Held until @swc/cli (via @nestjs/cli) allows chokidar 6; it requires
      # chokidar ^5 and a major bump breaks npm install with ERESOLVE.
      - dependency-name: 'chokidar'
        update-types:
          - 'version-update:semver-major'
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'master'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
  - package-ecosystem: 'docker'
    directory: '/'
    target-branch: 'master'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'docker'
    ignore:
      - dependency-name: 'node'
        update-types:
          - 'version-update:semver-major'
