name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Least privilege for contributor-assistant/github-action v2.6.1.
# actions: read lists this workflow's runs on the all-signed path.
#   A rerun needs a personal access token and is best-effort in the action.
# contents: write commits signatures/version1/cla.json on cla-signatures.
# pull-requests: write posts the signature request on the pull request.
# The job does not check out pull request code.
permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/raouf-b-dev/ecommerce-store-api/blob/master/CLA.md
          # Not master: master requires a pull request. Do not commit cla.json
          # on master. The action creates the file; do not add it by hand.
          # Protect All Branches requires signed commits on every branch except
          # master and develop. This action's contents-API commit is not an
          # SSH-signed commit, so cla-signatures has to be excluded from that
          # ruleset or signature storage will be rejected.
          branch: cla-signatures
          allowlist: "raouf-b-dev,dependabot[bot],*[bot]"
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-notsigned-prcomment: "Thank you for your contribution. If this is your first contribution, read the Contributor License Agreement and sign it by commenting the exact sentence below. You only need to sign once."
          # Signature storage on cla-signatures is the record. Leave merged
          # pull requests unlocked so discussion can continue.
          lock-pullrequest-aftermerge: "false"
