name: CI

on:
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 20 (cache npm)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run ESLint
        run: npm run lint:check

      - name: Run Prettier formatting check
        run: npm run format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 20 (cache npm)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 20 (cache npm)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run Unit Tests
        run: npm run test -- --ci

  arch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 20 (cache npm)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run Architecture Boundary Tests
        run: npm run test:arch

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 20 (cache npm)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run Build
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests, arch, build]
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

    services:
      postgres:
        image: postgres:16.3
        ports: ['5432:5432']
        env:
          POSTGRES_USER: ${{ secrets.CI_DB_USERNAME || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'postgres' }}
          POSTGRES_DB: ${{ secrets.CI_DB_DATABASE || 'test_db' }}
        options: >-
          --health-cmd="pg_isready -q"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis/redis-stack:7.2.0-v18
        ports: ['6379:6379', '8001:8001']
        env:
          REDIS_ARGS: ${{ secrets.CI_REDIS_PASSWORD && format('--requirepass {0}', secrets.CI_REDIS_PASSWORD) || '' }}
        options: >-
          --health-cmd="redis-cli ping || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 20 (cache npm)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install network and DB clients
        run: |
          sudo apt-get update -y
          sudo apt-get install -y netcat-openbsd redis-tools postgresql-client

      - name: Wait for services, detect hosts and create .env.test
        env:
          CI_DB_USERNAME: ${{ secrets.CI_DB_USERNAME }}
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          CI_DB_DATABASE: ${{ secrets.CI_DB_DATABASE }}
          CI_REDIS_PASSWORD: ${{ secrets.CI_REDIS_PASSWORD }}
          CI_REDIS_KEYPREFIX: ${{ secrets.CI_REDIS_KEYPREFIX }}
          CI_JWT_PRIVATE_KEY: ${{ secrets.CI_JWT_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          # Set defaults
          DB_USER="${CI_DB_USERNAME:-postgres}"
          DB_PASS="${CI_DB_PASSWORD:-postgres}"
          DB_NAME="${CI_DB_DATABASE:-test_db}"
          REDIS_PASS="${CI_REDIS_PASSWORD:-}"
          REDIS_KEYPREFIX="${CI_REDIS_KEYPREFIX:-ecom:test:}"

          # In GitHub Actions, services are accessible via localhost
          PG_HOST="localhost"
          REDIS_HOST_DETECTED="localhost"

          # Test PostgreSQL connection with retries
          echo "Testing PostgreSQL connection..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U "${DB_USER}" -d "${DB_NAME}"; then
              echo "PostgreSQL is ready at localhost:5432"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

          # Test Redis connection with retries
          echo "Testing Redis connection..."
          REDIS_CMD="redis-cli -h localhost -p 6379"
          if [ -n "${REDIS_PASS}" ]; then
            REDIS_CMD="${REDIS_CMD} -a ${REDIS_PASS}"
          fi

          for i in {1..30}; do
            if $REDIS_CMD ping > /dev/null 2>&1; then
              echo "Redis is ready at localhost:6379"
              break
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done

          # Write .env.test using the detected hosts
          cat > .env.test << ENVEOF
          NODE_ENV=test
          PORT=3000

          DB_HOST=${PG_HOST}
          DB_PORT=5432
          DB_USERNAME=${DB_USER}
          DB_PASSWORD=${DB_PASS}
          DB_DATABASE=${DB_NAME}

          REDIS_HOST=${REDIS_HOST_DETECTED}
          REDIS_PORT=6379
          REDIS_PASSWORD=${REDIS_PASS}
          REDIS_KEYPREFIX=${REDIS_KEYPREFIX}
          REDIS_DB=0

          JWT_PRIVATE_KEY="${CI_JWT_PRIVATE_KEY}"
          JWT_ACCESS_TOKEN_TTL=15m
          JWT_REFRESH_TOKEN_TTL=7d
          ENVEOF

          echo ".env.test created with DB_HOST=${PG_HOST} and REDIS_HOST=${REDIS_HOST_DETECTED}"
          echo "Contents of .env.test (passwords masked):"
          sed 's/PASSWORD=.*/PASSWORD=***/g' .env.test

          # Export the detected values as environment variables for subsequent steps
          echo "DETECTED_DB_HOST=${PG_HOST}" >> $GITHUB_ENV
          echo "DETECTED_REDIS_HOST=${REDIS_HOST_DETECTED}" >> $GITHUB_ENV
          echo "DETECTED_DB_USER=${DB_USER}" >> $GITHUB_ENV
          echo "DETECTED_DB_NAME=${DB_NAME}" >> $GITHUB_ENV

      - name: Run DB migrations (test)
        run: npm run migration:run:test
        env:
          NODE_ENV: test

      - name: Run E2E tests (CI)
        run: npm run test:e2e
        env:
          NODE_ENV: test

      - name: Cleanup .env.test
        if: always()
        run: rm -f .env.test || true

  ci:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests, arch, build, integration]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          lint_status="${{ needs.lint.result }}"
          typecheck_status="${{ needs.typecheck.result }}"
          unit_status="${{ needs.unit-tests.result }}"
          arch_status="${{ needs.arch.result }}"
          build_status="${{ needs.build.result }}"
          integration_status="${{ needs.integration.result }}"

          echo "lint: $lint_status"
          echo "typecheck: $typecheck_status"
          echo "unit-tests: $unit_status"
          echo "arch: $arch_status"
          echo "build: $build_status"
          echo "integration: $integration_status"

          # Check for failures/cancellations of parallel jobs
          for status in "$lint_status" "$typecheck_status" "$unit_status" "$arch_status" "$build_status"; do
            if [ "$status" = "failure" ] || [ "$status" = "cancelled" ]; then
              echo "One of the required parallel jobs failed or was cancelled."
              exit 1
            fi
          done

          # Integration job is only required to pass if it actually ran (not skipped)
          if [ "$integration_status" = "failure" ] || [ "$integration_status" = "cancelled" ]; then
            echo "Integration tests failed or were cancelled."
            exit 1
          fi

          echo "All checks passed successfully!"
