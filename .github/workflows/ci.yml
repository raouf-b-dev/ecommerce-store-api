name: CI

on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master, develop]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-env:
    name: Resolve env (.env.example)
    runs-on: ubuntu-latest
    outputs:
      postgres_image: ${{ steps.resolve.outputs.postgres_image }}
      postgres_container_name: ${{ steps.resolve.outputs.postgres_container_name }}
      redis_image: ${{ steps.resolve.outputs.redis_image }}
      redis_container_name: ${{ steps.resolve.outputs.redis_container_name }}
      cors_allowed_origins: ${{ steps.resolve.outputs.cors_allowed_origins }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve from .env.example
        id: resolve
        uses: ./.github/actions/resolve-env-example

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:check

      - name: Run Prettier formatting check
        run: npm run format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test:ci

  arch:
    name: Architecture Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Architecture Boundary Tests
        run: npm run test:arch

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (high/critical)
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  openapi-audit:
    name: OpenAPI Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [resolve-env, build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    services:
      postgres:
        image: ${{ needs.resolve-env.outputs.postgres_image }}
        ports: ['5432:5432']
        env:
          POSTGRES_USER: ${{ secrets.CI_DB_USERNAME || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'postgres' }}
          POSTGRES_DB: ${{ secrets.CI_DB_DATABASE || 'test_db' }}
        options: >-
          --health-cmd="pg_isready -q"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: ${{ needs.resolve-env.outputs.redis_image }}
        ports: ['6379:6379', '8001:8001']
        env:
          REDIS_ARGS: ${{ secrets.CI_REDIS_PASSWORD && format('--requirepass {0}', secrets.CI_REDIS_PASSWORD) || '' }}

    env:
      NODE_ENV: test
      POSTGRES_IMAGE: ${{ needs.resolve-env.outputs.postgres_image }}
      POSTGRES_CONTAINER_NAME: ${{ needs.resolve-env.outputs.postgres_container_name }}
      REDIS_IMAGE: ${{ needs.resolve-env.outputs.redis_image }}
      REDIS_CONTAINER_NAME: ${{ needs.resolve-env.outputs.redis_container_name }}
      CORS_ALLOWED_ORIGINS: ${{ needs.resolve-env.outputs.cors_allowed_origins }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare test environment
        uses: ./.github/actions/prepare-test-env
        with:
          db-username: ${{ secrets.CI_DB_USERNAME }}
          db-password: ${{ secrets.CI_DB_PASSWORD }}
          db-database: ${{ secrets.CI_DB_DATABASE }}
          redis-password: ${{ secrets.CI_REDIS_PASSWORD }}
          redis-keyprefix: ${{ secrets.CI_REDIS_KEYPREFIX }}
          jwt-private-key: ${{ secrets.CI_JWT_PRIVATE_KEY }}
          metrics-api-key: ${{ secrets.CI_METRICS_API_KEY }}

      - name: Run OpenAPI audit
        run: npm run audit:openapi

      - name: Cleanup .env.test
        if: always()
        run: rm -f .env.test || true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/src/main.js
          echo "dist/src/main.js exists"

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-app
          path: dist/
          if-no-files-found: error
          retention-days: 1

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [typecheck, unit-tests, build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    env:
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Integration Tests
        run: npm run test:integration

  redis-chaos-tests:
    name: Redis Chaos Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [typecheck, unit-tests, build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    env:
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Redis reconnect chaos tests
        run: npm run test:redis:chaos

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [resolve-env, typecheck, unit-tests, build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    services:
      postgres:
        image: ${{ needs.resolve-env.outputs.postgres_image }}
        ports: ['5432:5432']
        env:
          POSTGRES_USER: ${{ secrets.CI_DB_USERNAME || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'postgres' }}
          POSTGRES_DB: ${{ secrets.CI_DB_DATABASE || 'test_db' }}
        options: >-
          --health-cmd="pg_isready -q"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: ${{ needs.resolve-env.outputs.redis_image }}
        ports: ['6379:6379', '8001:8001']
        env:
          REDIS_ARGS: ${{ secrets.CI_REDIS_PASSWORD && format('--requirepass {0}', secrets.CI_REDIS_PASSWORD) || '' }}

    env:
      NODE_ENV: test
      POSTGRES_IMAGE: ${{ needs.resolve-env.outputs.postgres_image }}
      POSTGRES_CONTAINER_NAME: ${{ needs.resolve-env.outputs.postgres_container_name }}
      REDIS_IMAGE: ${{ needs.resolve-env.outputs.redis_image }}
      REDIS_CONTAINER_NAME: ${{ needs.resolve-env.outputs.redis_container_name }}
      CORS_ALLOWED_ORIGINS: ${{ needs.resolve-env.outputs.cors_allowed_origins }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare test environment
        uses: ./.github/actions/prepare-test-env
        with:
          db-username: ${{ secrets.CI_DB_USERNAME }}
          db-password: ${{ secrets.CI_DB_PASSWORD }}
          db-database: ${{ secrets.CI_DB_DATABASE }}
          redis-password: ${{ secrets.CI_REDIS_PASSWORD }}
          redis-keyprefix: ${{ secrets.CI_REDIS_KEYPREFIX }}
          jwt-private-key: ${{ secrets.CI_JWT_PRIVATE_KEY }}
          metrics-api-key: ${{ secrets.CI_METRICS_API_KEY }}

      - name: Run DB migrations (test)
        run: npm run migration:run:test

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Cleanup .env.test
        if: always()
        run: rm -f .env.test || true

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [resolve-env, typecheck, unit-tests, build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    services:
      postgres:
        image: ${{ needs.resolve-env.outputs.postgres_image }}
        ports: ['5432:5432']
        env:
          POSTGRES_USER: ${{ secrets.CI_DB_USERNAME || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'postgres' }}
          POSTGRES_DB: ${{ secrets.CI_DB_DATABASE || 'test_db' }}
        options: >-
          --health-cmd="pg_isready -q"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: ${{ needs.resolve-env.outputs.redis_image }}
        ports: ['6379:6379', '8001:8001']
        env:
          REDIS_ARGS: ${{ secrets.CI_REDIS_PASSWORD && format('--requirepass {0}', secrets.CI_REDIS_PASSWORD) || '' }}

    env:
      NODE_ENV: test
      POSTGRES_IMAGE: ${{ needs.resolve-env.outputs.postgres_image }}
      POSTGRES_CONTAINER_NAME: ${{ needs.resolve-env.outputs.postgres_container_name }}
      REDIS_IMAGE: ${{ needs.resolve-env.outputs.redis_image }}
      REDIS_CONTAINER_NAME: ${{ needs.resolve-env.outputs.redis_container_name }}
      CORS_ALLOWED_ORIGINS: ${{ needs.resolve-env.outputs.cors_allowed_origins }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-app
          path: dist/

      - name: Verify downloaded artifact
        run: |
          test -f dist/src/main.js
          echo "dist/src/main.js exists"

      - name: Prepare test environment
        uses: ./.github/actions/prepare-test-env
        with:
          db-username: ${{ secrets.CI_DB_USERNAME }}
          db-password: ${{ secrets.CI_DB_PASSWORD }}
          db-database: ${{ secrets.CI_DB_DATABASE }}
          redis-password: ${{ secrets.CI_REDIS_PASSWORD }}
          redis-keyprefix: ${{ secrets.CI_REDIS_KEYPREFIX }}
          jwt-private-key: ${{ secrets.CI_JWT_PRIVATE_KEY }}
          metrics-api-key: ${{ secrets.CI_METRICS_API_KEY }}

      - name: Run DB migrations (test)
        run: npm run migration:run:test

      - name: Run smoke test
        run: |
          set -euo pipefail

          PORT=3000 npm run start:test &
          APP_PID=$!

          ready=false
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/health/readiness | grep -q '"status":"ok"'; then
              echo "App ready at http://localhost:3000"
              ready=true
              break
            fi
            echo "Waiting for app readiness... ($i/30)"
            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "Application failed to become ready"
            kill -SIGTERM $APP_PID 2>/dev/null || true
            exit 1
          fi

          PORT=3000 npm run smoke-test -- --base-url=http://localhost:3000
          kill -SIGTERM $APP_PID || true
        env:
          METRICS_API_KEY: ${{ secrets.CI_METRICS_API_KEY }}

      - name: Cleanup .env.test
        if: always()
        run: rm -f .env.test || true

  restore-drill:
    name: Restore Drill
    runs-on: ubuntu-latest
    needs: [resolve-env, typecheck, unit-tests]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    services:
      postgres:
        image: ${{ needs.resolve-env.outputs.postgres_image }}
        ports: ['5432:5432']
        env:
          POSTGRES_USER: ${{ secrets.CI_DB_USERNAME || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'postgres' }}
          POSTGRES_DB: ${{ secrets.CI_DB_DATABASE || 'test_db' }}
        options: >-
          --health-cmd="pg_isready -q"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: ${{ secrets.CI_DB_USERNAME || 'postgres' }}
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'postgres' }}
      DB_DATABASE: ${{ secrets.CI_DB_DATABASE || 'test_db' }}
      POSTGRES_IMAGE: ${{ needs.resolve-env.outputs.postgres_image }}
      POSTGRES_CONTAINER_NAME: ${{ needs.resolve-env.outputs.postgres_container_name }}
      CORS_ALLOWED_ORIGINS: ${{ needs.resolve-env.outputs.cors_allowed_origins }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare DB environment
        uses: ./.github/actions/prepare-db-env
        with:
          db-username: ${{ secrets.CI_DB_USERNAME || 'postgres' }}
          db-password: ${{ secrets.CI_DB_PASSWORD || 'postgres' }}
          db-database: ${{ secrets.CI_DB_DATABASE || 'test_db' }}
          jwt-private-key: ${{ secrets.CI_JWT_PRIVATE_KEY }}
          metrics-api-key: ${{ secrets.CI_METRICS_API_KEY || 'restore-drill-ci' }}

      - name: Run DB migrations (test)
        run: npm run migration:run:test

      - name: Run restore drill
        run: npm run db:restore:drill

      - name: Cleanup .env.test
        if: always()
        run: rm -f .env.test || true

  restore-drill-smoke:
    name: Restore Drill Smoke
    runs-on: ubuntu-latest
    needs: [resolve-env, typecheck, unit-tests, build]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'

    services:
      postgres:
        image: ${{ needs.resolve-env.outputs.postgres_image }}
        ports: ['5432:5432']
        env:
          POSTGRES_USER: ${{ secrets.CI_DB_USERNAME || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'postgres' }}
          POSTGRES_DB: ${{ secrets.CI_DB_DATABASE || 'test_db' }}
        options: >-
          --health-cmd="pg_isready -q"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: ${{ needs.resolve-env.outputs.redis_image }}
        ports: ['6379:6379', '8001:8001']
        env:
          REDIS_ARGS: ${{ secrets.CI_REDIS_PASSWORD && format('--requirepass {0}', secrets.CI_REDIS_PASSWORD) || '' }}

    env:
      NODE_ENV: test
      POSTGRES_IMAGE: ${{ needs.resolve-env.outputs.postgres_image }}
      POSTGRES_CONTAINER_NAME: ${{ needs.resolve-env.outputs.postgres_container_name }}
      REDIS_IMAGE: ${{ needs.resolve-env.outputs.redis_image }}
      REDIS_CONTAINER_NAME: ${{ needs.resolve-env.outputs.redis_container_name }}
      CORS_ALLOWED_ORIGINS: ${{ needs.resolve-env.outputs.cors_allowed_origins }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-app
          path: dist/

      - name: Verify downloaded artifact
        run: |
          test -f dist/src/main.js
          echo "dist/src/main.js exists"

      - name: Prepare test environment
        uses: ./.github/actions/prepare-test-env
        with:
          db-username: ${{ secrets.CI_DB_USERNAME }}
          db-password: ${{ secrets.CI_DB_PASSWORD }}
          db-database: ${{ secrets.CI_DB_DATABASE }}
          redis-password: ${{ secrets.CI_REDIS_PASSWORD }}
          redis-keyprefix: ${{ secrets.CI_REDIS_KEYPREFIX }}
          jwt-private-key: ${{ secrets.CI_JWT_PRIVATE_KEY }}
          metrics-api-key: ${{ secrets.CI_METRICS_API_KEY }}

      - name: Run DB migrations (test)
        run: npm run migration:run:test

      - name: Run restore drill (keep dump)
        run: node scripts/db-restore-drill.js --yes --keep-dump

      - name: Point app at restored drill database
        run: |
          set -euo pipefail
          if grep -q '^DB_DATABASE=' .env.test; then
            sed -i 's/^DB_DATABASE=.*/DB_DATABASE="ecommerce_restore_drill"/' .env.test
          else
            echo 'DB_DATABASE="ecommerce_restore_drill"' >> .env.test
          fi

      - name: Start app and run smoke against restored DB
        run: |
          set -euo pipefail

          PORT=3000 npm run start:test &
          APP_PID=$!

          ready=false
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/health/readiness | grep -q '"status":"ok"'; then
              echo "App ready at http://localhost:3000"
              ready=true
              break
            fi
            echo "Waiting for app readiness... ($i/30)"
            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "Application failed to become ready against restored DB"
            kill -SIGTERM $APP_PID 2>/dev/null || true
            exit 1
          fi

          PORT=3000 npm run smoke-test -- --base-url=http://localhost:3000
          kill -SIGTERM $APP_PID || true
        env:
          METRICS_API_KEY: ${{ secrets.CI_METRICS_API_KEY }}
          DB_DATABASE: ecommerce_restore_drill

      - name: Cleanup .env.test and drill dump
        if: always()
        run: |
          rm -f .env.test || true
          rm -f backups/restore-drill_*.dump || true

  ci:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs:
      [
        resolve-env,
        lint,
        typecheck,
        unit-tests,
        arch,
        audit,
        build,
        openapi-audit,
        integration-tests,
        redis-chaos-tests,
        e2e-tests,
        smoke-test,
        restore-drill,
        restore-drill-smoke,
      ]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          # Push runs (master, v* tags) feed docker-publish, so every required job
          # must have actually run and succeeded. PRs and manual runs only fail on
          # failure/cancelled, because fork PRs intentionally skip the test jobs.
          strict=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            strict=true
          fi

          # restore-drill-smoke only runs on pushes to master; skipped on PRs,
          # tags and manual runs is OK.
          restore_drill_smoke_required=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/master" ]; then
            restore_drill_smoke_required=true
          fi

          echo "event: $GITHUB_EVENT_NAME ($GITHUB_REF), strict: $strict"

          failed=false
          check() {
            local name="$1" status="$2" require_success="$3"
            echo "$name: $status"
            if [ "$status" = "failure" ] || [ "$status" = "cancelled" ]; then
              echo "::error::$name $status"
              failed=true
            elif [ "$require_success" = true ] && [ "$status" != "success" ]; then
              echo "::error::$name was $status but must succeed on this run"
              failed=true
            fi
          }

          check resolve-env "${{ needs.resolve-env.result }}" "$strict"
          check lint "${{ needs.lint.result }}" "$strict"
          check typecheck "${{ needs.typecheck.result }}" "$strict"
          check unit-tests "${{ needs.unit-tests.result }}" "$strict"
          check arch "${{ needs.arch.result }}" "$strict"
          check audit "${{ needs.audit.result }}" "$strict"
          check build "${{ needs.build.result }}" "$strict"
          check openapi-audit "${{ needs.openapi-audit.result }}" "$strict"
          check integration-tests "${{ needs.integration-tests.result }}" "$strict"
          check redis-chaos-tests "${{ needs.redis-chaos-tests.result }}" "$strict"
          check e2e-tests "${{ needs.e2e-tests.result }}" "$strict"
          check smoke-test "${{ needs.smoke-test.result }}" "$strict"
          check restore-drill "${{ needs.restore-drill.result }}" "$strict"
          check restore-drill-smoke "${{ needs.restore-drill-smoke.result }}" "$restore_drill_smoke_required"

          if [ "$failed" = true ]; then
            echo "One or more required jobs did not pass."
            exit 1
          fi

          echo "All checks passed successfully!"

  docker-validate:
    name: Docker Validate
    runs-on: ubuntu-latest
    needs: [ci]
    # ci runs with always() and depends on jobs that skip outside master, so the
    # implicit success() check would skip this job; gate on ci's result instead.
    if: ${{ !cancelled() && needs.ci.result == 'success' && github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: ecommerce-store-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-publish:
    name: Docker Publish
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ !cancelled() && needs.ci.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/raouf-b-dev/ecommerce-store-api
          tags: |
            type=sha,prefix=sha-,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
