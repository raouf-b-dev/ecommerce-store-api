name: CI

on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:check

      - name: Run Prettier formatting check
        run: npm run format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test:ci

  arch:
    name: Architecture Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Architecture Boundary Tests
        run: npm run test:arch

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (high/critical)
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-app
          path: dist/
          retention-days: 1

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests, build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    env:
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Integration Tests
        run: npm run test:integration

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests, build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    services:
      postgres:
        image: postgres:18.4
        ports: ['5432:5432']
        env:
          POSTGRES_USER: ${{ secrets.CI_DB_USERNAME || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'postgres' }}
          POSTGRES_DB: ${{ secrets.CI_DB_DATABASE || 'test_db' }}
        options: >-
          --health-cmd="pg_isready -q"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis/redis-stack:7.2.0-v18
        ports: ['6379:6379', '8001:8001']
        env:
          REDIS_ARGS: ${{ secrets.CI_REDIS_PASSWORD && format('--requirepass {0}', secrets.CI_REDIS_PASSWORD) || '' }}

    env:
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare test environment
        uses: ./.github/actions/prepare-test-env
        with:
          db-username: ${{ secrets.CI_DB_USERNAME }}
          db-password: ${{ secrets.CI_DB_PASSWORD }}
          db-database: ${{ secrets.CI_DB_DATABASE }}
          redis-password: ${{ secrets.CI_REDIS_PASSWORD }}
          redis-keyprefix: ${{ secrets.CI_REDIS_KEYPREFIX }}
          jwt-private-key: ${{ secrets.CI_JWT_PRIVATE_KEY }}
          metrics-api-key: ${{ secrets.CI_METRICS_API_KEY }}

      - name: Run DB migrations (test)
        run: npm run migration:run:test

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Cleanup .env.test
        if: always()
        run: rm -f .env.test || true

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests, build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    services:
      postgres:
        image: postgres:18.4
        ports: ['5432:5432']
        env:
          POSTGRES_USER: ${{ secrets.CI_DB_USERNAME || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'postgres' }}
          POSTGRES_DB: ${{ secrets.CI_DB_DATABASE || 'test_db' }}
        options: >-
          --health-cmd="pg_isready -q"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis/redis-stack:7.2.0-v18
        ports: ['6379:6379', '8001:8001']
        env:
          REDIS_ARGS: ${{ secrets.CI_REDIS_PASSWORD && format('--requirepass {0}', secrets.CI_REDIS_PASSWORD) || '' }}

    env:
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-app
          path: dist/

      - name: Prepare test environment
        uses: ./.github/actions/prepare-test-env
        with:
          db-username: ${{ secrets.CI_DB_USERNAME }}
          db-password: ${{ secrets.CI_DB_PASSWORD }}
          db-database: ${{ secrets.CI_DB_DATABASE }}
          redis-password: ${{ secrets.CI_REDIS_PASSWORD }}
          redis-keyprefix: ${{ secrets.CI_REDIS_KEYPREFIX }}
          jwt-private-key: ${{ secrets.CI_JWT_PRIVATE_KEY }}
          metrics-api-key: ${{ secrets.CI_METRICS_API_KEY }}

      - name: Run DB migrations (test)
        run: npm run migration:run:test

      - name: Run smoke test
        run: |
          PORT=3000 npm run start:test &
          APP_PID=$!

          for i in {1..30}; do
            if curl -s http://localhost:3000/health/readiness | grep -q '"status":"ok"'; then
              echo "App ready at http://localhost:3000"
              break
            fi
            echo "Waiting for app readiness... ($i/30)"
            sleep 1
          done

          PORT=3000 npm run smoke-test -- --base-url=http://localhost:3000
          kill -SIGTERM $APP_PID || true
        env:
          METRICS_API_KEY: ${{ secrets.CI_METRICS_API_KEY }}

      - name: Cleanup .env.test
        if: always()
        run: rm -f .env.test || true

  ci:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        typecheck,
        unit-tests,
        arch,
        audit,
        build,
        integration-tests,
        e2e-tests,
        smoke-test,
      ]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          lint_status="${{ needs.lint.result }}"
          typecheck_status="${{ needs.typecheck.result }}"
          unit_status="${{ needs.unit-tests.result }}"
          arch_status="${{ needs.arch.result }}"
          audit_status="${{ needs.audit.result }}"
          build_status="${{ needs.build.result }}"
          integration_status="${{ needs.integration-tests.result }}"
          e2e_status="${{ needs.e2e-tests.result }}"
          smoke_status="${{ needs.smoke-test.result }}"

          echo "lint: $lint_status"
          echo "typecheck: $typecheck_status"
          echo "unit-tests: $unit_status"
          echo "arch: $arch_status"
          echo "audit: $audit_status"
          echo "build: $build_status"
          echo "integration-tests: $integration_status"
          echo "e2e-tests: $e2e_status"
          echo "smoke-test: $smoke_status"

          for status in "$lint_status" "$typecheck_status" "$unit_status" "$arch_status" "$audit_status" "$build_status"; do
            if [ "$status" = "failure" ] || [ "$status" = "cancelled" ]; then
              echo "One of the required parallel jobs failed or was cancelled."
              exit 1
            fi
          done

          for status in "$integration_status" "$e2e_status" "$smoke_status"; do
            if [ "$status" = "failure" ] || [ "$status" = "cancelled" ]; then
              echo "One of the test jobs failed or was cancelled."
              exit 1
            fi
          done

          echo "All checks passed successfully!"

  docker-validate:
    name: Docker Validate
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ecommerce-store-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-publish:
    name: Docker Publish
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/raouf-b-dev/ecommerce-store-api
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
